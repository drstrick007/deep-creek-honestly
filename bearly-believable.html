<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask Bertha has moved</title>
<link rel="canonical" href="https://pivotalvacationproperties.com/ask-bertha/">
<meta name="robots" content="noindex, follow">
<!--
  Retired 2026-08-28. This page moved to pivotalvacationproperties.com.

  GitHub Pages serves static files only, so there is no 301 available here. The
  redirect is done in script and carries the query string with it, because the
  query string is the whole point: ?experience=amandafam_beta is what tells the
  backend which beta cohort a guest belongs to, and dropping it would silently
  file an active tester's answers and feedback under public traffic.

  The session id in localStorage travels too, as ?bbs= -- deliberately not ?s=,
  which WordPress reserves for site search and which turns any destination URL
  into a "Page not found". localStorage is per-origin,
  so without that hand-off every returning beta tester would start a brand new
  conversation on the new domain and their feedback history would split in two.
  The new site adopts it once and strips it from the address bar.

  location.replace, not location.href: the old URL must not sit in the back
  button, or a guest pressing back lands here and bounces forward again.

  The meta refresh below is the fallback for a browser with script disabled. It
  cannot carry the query string, so it is deliberately second and not first.
-->
<meta http-equiv="refresh" content="3;url=https://pivotalvacationproperties.com/ask-bertha/">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#F6F1E7;color:#2F3B2C;
       font:400 17px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .card{max-width:30rem;padding:2rem;text-align:center}
  h1{font-size:1.3rem;font-weight:600;margin:0 0 .6rem}
  p{margin:0 0 1.2rem;opacity:.85}
  a{color:#2F3B2C}
</style>
</head>
<body>
  <div class="card">
    <h1>Bearly Believable has moved</h1>
    <p>Taking you to the new site&hellip;</p>
    <p><a id="go" href="https://pivotalvacationproperties.com/ask-bertha/">pivotalvacationproperties.com</a></p>
  </div>
<script>
(function(){
  var DEST = "https://pivotalvacationproperties.com/ask-bertha/";
  var q = new URLSearchParams(location.search);

  // Anything the guest arrived with is kept. utm_* included: a beta link may have
  // been shared onward and that attribution is real too.
  var out = new URLSearchParams();
  ["experience","cohort","fb","utm_source","utm_medium","utm_campaign","utm_content","utm_term","q"]
    .forEach(function(k){ var v = q.get(k); if (v) out.set(k, v); });

  // Hand the beta session across the origin boundary. Only a well-formed UUID is
  // passed on -- never whatever happens to be sitting in that key.
  try {
    var s = localStorage.getItem("bertha_session_id");
    if (s && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(s)) {
      out.set("bbs", s);
    }
  } catch(e){}

  var url = DEST + (out.toString() ? (DEST.indexOf("?") > -1 ? "&" : "?") + out.toString() : "");
  var a = document.getElementById("go");
  if (a) a.href = url;
  location.replace(url);
})();
</script>
</body>
</html>
